name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy only uses SSH secrets, so the GitHub token can stay read-only.
permissions:
  contents: read

# One deploy at a time. A newer push waits instead of racing the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Host key check. Add the secret (SHA256 fingerprint of the server's
          # host key) to turn it on; while it's unset the check is skipped.
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          script: |
            # Stop on the first failure, so a failed pull or build never
            # restarts the backend (a restart drops every live tunnel).
            set -e
            cd ~/personal/GoPort/backend
            git pull --ff-only origin main
            cd ..
            docker exec goport-backend sh -c 'if [ -d /pb_data ] && [ ! -f /app/pb_data/data.db ]; then cp -a /pb_data/. /app/pb_data/; fi' || true
            docker-compose build --no-cache backend
            docker-compose stop backend || true
            docker-compose rm -f backend || true
            docker-compose up -d --no-deps --remove-orphans backend
