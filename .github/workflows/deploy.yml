name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy only uses SSH secrets, so the GitHub token can stay read-only.
permissions:
  contents: read

# One deploy at a time. A newer push waits instead of racing the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Host key check. Add the secret (SHA256 fingerprint of the server's
          # host key) to turn it on; while it's unset the check is skipped.
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          script: |
            # Stop on the first failure, so a failed pull or build never
            # restarts the backend (a restart drops every live tunnel).
            set -e
            cd ~/personal/GoPort/backend
            git pull --ff-only origin main
            cd ..
            docker exec goport-backend sh -c 'if [ -d /pb_data ] && [ ! -f /app/pb_data/data.db ]; then cp -a /pb_data/. /app/pb_data/; fi' || true
            docker-compose build --no-cache backend
            docker-compose stop backend || true
            # Copy the database out of the stopped container before the new
            # version migrates it; the last 10 copies are kept. A failed copy
            # is reported but doesn't stop the deploy, so the backend never
            # stays down because of it.
            backup=~/goport-backups/backend-$(date -u +%Y%m%dT%H%M%SZ)
            if mkdir -p "$backup" && docker cp goport-backend:/app/pb_data/data.db "$backup/data.db"; then
              docker cp goport-backend:/app/pb_data/data.db-wal "$backup/data.db-wal" 2>/dev/null || true
              echo "database copied to $backup"
              ls -1dt ~/goport-backups/backend-* | tail -n +11 | xargs -r rm -rf
            else
              echo "WARNING: database backup failed; deploying without one"
            fi
            docker-compose rm -f backend || true
            docker-compose up -d --no-deps --remove-orphans backend
